# Railway 部署配置（项目根目录）

[build]
builder = "NIXPACKS"
# 用 npx 跑 pnpm（npx 知道 npm 全局 bin 路径）
buildCommand = "cd server && npx -y pnpm@11.20.0 install --frozen-lockfile && npx -y pnpm@11.20.0 prisma generate --schema=./prisma/schema.postgres.prisma && npx -y pnpm@11.20.0 build"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
