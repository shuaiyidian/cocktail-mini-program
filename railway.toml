# Railway 部署配置（项目根目录）

[build]
builder = "NIXPACKS"
# npx pnpm@10 走 npm 的 bin 目录
buildCommand = "cd server && npx -y pnpm@10 install --frozen-lockfile && npx -y pnpm@10 prisma generate --schema=./prisma/schema.postgres.prisma && npx -y pnpm@10 build"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
