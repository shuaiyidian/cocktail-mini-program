# Railway 部署配置（项目根目录）

[build]
builder = "NIXPACKS"
# pnpm@9 兼容老版 Node.js（不依赖 styleText）
buildCommand = "cd server && npx -y pnpm@9.15.4 install --frozen-lockfile && npx -y pnpm@9.15.4 prisma generate --schema=./prisma/schema.postgres.prisma && npx -y pnpm@9.15.4 build"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
