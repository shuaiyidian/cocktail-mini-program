# Railway 部署配置（项目根目录）
# 用法：直接在 GitHub 关联这个仓库即可，无需设 Root Directory
# 构建会 cd 到 server/ 子目录运行

[build]
builder = "NIXPACKS"
buildCommand = "cd server && pnpm install --frozen-lockfile && pnpm prisma generate --schema=./prisma/schema.postgres.prisma && pnpm build"

[deploy]
startCommand = "cd server && pnpm prisma db push --accept-data-loss --schema=./prisma/schema.postgres.prisma && node dist/server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# 环境变量（在 Railway 控制台设置）
# - DATABASE_URL：Railway 自动注入 PostgreSQL 连接
# - JWT_SECRET：用 railway variables set JWT_SECRET="your-secret"
# - NODE_ENV=production（自动设置）
# - CORS_ORIGIN=*
# - WX_APPID / WX_SECRET：填你的小程序凭证
