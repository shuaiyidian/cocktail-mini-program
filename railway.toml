# Railway 部署配置（项目根目录）

[build]
builder = "NIXPACKS"
# pnpm@10 兼容 Node 20（pnpm@11 需要 Node 22+ 的 styleText API）
buildCommand = "cd server && npm install -g pnpm@10 && export PATH=\"$(npm root -g)/../bin:$PATH\" && pnpm install --frozen-lockfile && pnpm prisma generate --schema=./prisma/schema.postgres.prisma && pnpm build"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
