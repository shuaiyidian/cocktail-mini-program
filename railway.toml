# Railway 部署配置（项目根目录）

[build]
builder = "NIXPACKS"
buildCommand = "cd server && npx -y pnpm@9.15.4 install --frozen-lockfile --config.engine-strict=false && npx -y pnpm@9.15.4 prisma generate --schema=./prisma/schema.postgres.prisma && npx -y pnpm@9.15.4 build --config.engine-strict=false"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
