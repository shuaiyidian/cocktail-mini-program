# Railway 部署配置（项目根目录）

[build]
builder = "NIXPACKS"
# 用 env 命令显式传递 DATABASE_URL 给每个 npx 子进程
buildCommand = "cd server && mv prisma/schema.prisma prisma/schema.sqlite.prisma && cp prisma/schema.postgres.prisma prisma/schema.prisma && env DATABASE_URL='postgresql://placeholder:placeholder@localhost:5432/placeholder' npx -y pnpm@8.15.9 install --no-frozen-lockfile && env DATABASE_URL='postgresql://placeholder:placeholder@localhost:5432/placeholder' npx -y pnpm@8.15.9 prisma generate && env DATABASE_URL='postgresql://placeholder:placeholder@localhost:5432/placeholder' npx -y pnpm@8.15.9 build && mv prisma/schema.sqlite.prisma prisma/schema.prisma"
