# Railway 部署配置（项目根目录）

[build]
builder = "NIXPACKS"
# build 阶段没有真 DATABASE_URL，用占位让 prisma generate 验证通过
buildCommand = "cd server && export DATABASE_URL=\"postgresql://placeholder:placeholder@localhost:5432/placeholder\" && mv prisma/schema.prisma prisma/schema.sqlite.prisma && cp prisma/schema.postgres.prisma prisma/schema.prisma && npx -y pnpm@8.15.9 install --no-frozen-lockfile && npx -y pnpm@8.15.9 prisma generate && npx -y pnpm@8.15.9 build && mv prisma/schema.sqlite.prisma prisma/schema.prisma"
