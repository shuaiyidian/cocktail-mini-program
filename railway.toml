# Railway 部署配置（项目根目录）

[build]
builder = "NIXPACKS"
# 用 npm 全局装 pnpm（避免镜像没 pnpm）
buildCommand = "cd server && npm install -g pnpm@11.20.0 && pnpm install --frozen-lockfile && pnpm prisma generate --schema=./prisma/schema.postgres.prisma && pnpm build"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
