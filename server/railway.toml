# Railway 部署配置
# 用法：railway up（CLI）或在 Railway 控制台关联仓库
# 文档：https://docs.railway.app/

[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile && pnpm prisma generate && pnpm build"

[deploy]
startCommand = "pnpm prisma db push --accept-data-loss && pnpm prisma:seed && pnpm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# 环境变量（在 Railway 控制台设置）
# - DATABASE_URL：Railway 自动注入 PostgreSQL 连接
# - JWT_SECRET：用 railway variables set JWT_SECRET="your-secret"
# - NODE_ENV=production
# - CORS_ORIGIN=*
